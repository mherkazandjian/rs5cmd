[package]
name = "rs5cmd"
version = "0.1.0"
edition = "2021"
description = "A Rust port of s5cmd — a very fast S3 and local filesystem execution tool"
license = "MIT"

[[bin]]
name = "rs5cmd"
path = "src/main.rs"

# Benchmark-only in-memory S3 stub (raw tokio, no extra deps).
[[bin]]
name = "s3stub"
path = "src/bin/s3stub.rs"
required-features = ["bench-stub"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "cargo", "env"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# AWS S3
# The default features less `sso`, which is rs5cmd's own feature `sso` (on by default), so a
# build can leave out the SSO and SSO-OIDC clients.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process"] }
# Without the default features: every S3 client gets rs5cmd's HTTP client (`build_http_client`),
# and the default `rustls` feature linked the SDK's legacy client in as well (hyper 0.14,
# rustls 0.21 and ring, h2 0.3; F75). The credential providers keep the SDK's default HTTPS
# client through aws-config.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio"] }
aws-smithy-runtime-api = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
bytes = "1"
http-body = "1"
aws-credential-types = "1"

# rs5cmd's HTTP client for S3 (src/storage/s3.rs `build_http_client`): hyper + hyper-rustls,
# HTTP/1.1 only (#14), adapted to the smithy `HttpClient` trait; it also carries
# `--no-verify-ssl`, `--proxy` and `--ca-certs-file`. `rustls`/`http` are also used by `fast`.
# One crypto provider, aws-lc-rs, on both paths (F75): ring is not linked.
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# The platform's trust store (with SSL_CERT_FILE / SSL_CERT_DIR), as the SDK's client used.
rustls-native-certs = "0.8"
# Parse a custom CA bundle (`--ca-certs-file`) into rustls certificates.
rustls-pemfile = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "native-tokio"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper = "1"
http = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Serialization / output
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
regex = "1"
glob = "0.3"
walkdir = "2"
indicatif = "0.17"
shell-words = "1"
humansize = "2"
url = "2"
bytesize = "1"
filetime = "0.2"
md-5 = "0.10"
# Proxy support (--proxy/-x) for the default SDK path.
tokio-socks = "0.5"
tower-service = "0.3"
base64 = "0.22"
webpki-roots = "0.26"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- io_uring fast path (Linux-only, opt-in) ---
# Gated behind the `fast` feature so the default build is unaffected and still
# compiles on non-Linux / without io_uring.
[features]
default = ["sso"]
# Credentials from AWS IAM Identity Center (SSO) profiles: `sso_session` / `sso_start_url` in
# ~/.aws/config, as `aws sso login` sets up. Without it such a profile yields no credentials.
sso = ["aws-config/sso"]
fast = ["dep:monoio", "dep:monoio-transports", "dep:monoio-http", "dep:monoio-rustls", "dep:aws-sigv4", "dep:sha2", "dep:hex", "dep:core_affinity"]
# FUSE mount (`rs5cmd mount`): rclone-style local mount of a remote S3 path.
# Linux mounts via libfuse3's `fusermount3` helper at runtime — the `fuse3`
# crate speaks the FUSE protocol in pure Rust, so no libfuse dev headers are
# needed to BUILD; macOS uses macFUSE. Opt-in so the default build stays free of
# FUSE deps, mirroring the `fast` precedent.
mount = ["dep:fuse3"]
# Builds the s3stub benchmark target (uses only tokio).
bench-stub = []

[dependencies.fuse3]
version = "0.8"
optional = true
default-features = false
# `tokio-runtime` integrates with the existing tokio runtime; `unprivileged`
# enables rootless mounting via the setuid `fusermount3` helper (rclone-style).
features = ["tokio-runtime", "unprivileged"]

# Also used outside `mount`: a closed stdout pipe ends the process by SIGPIPE (src/output.rs).
[dependencies.libc]
version = "0.2"

[dependencies.monoio]
version = "0.2"
optional = true

[dependencies.monoio-transports]
version = "0.5"
optional = true

[dependencies.monoio-http]
version = "0.3"
optional = true

[dependencies.monoio-rustls]
version = "0.4"
optional = true

[dependencies.aws-sigv4]
version = "1"
optional = true
features = ["sign-http"]

[dependencies.sha2]
version = "0.10"
optional = true

[dependencies.hex]
version = "0.4"
optional = true

[dependencies.core_affinity]
version = "0.8"
optional = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Measured in the optimization review (docs/OPTIMIZATION-REVIEW.md, E5): fat LTO with one codegen
# unit uses about 11 % less CPU on every workload tried and makes the binary about 24 % smaller.
# `panic = "abort"`: no unwinding tables or landing pads. Nothing catches a panic (a panic in a
# task already ended the command), and a closed stdout pipe no longer panics (#7).
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
