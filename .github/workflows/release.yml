name: release

# Build portable Linux (glibc) and self-contained (macOS) release binaries for
# x86_64 and aarch64, and attach them to the GitHub Release.
#
# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`),
# or manually via the Actions tab (workflow_dispatch) for a dry run that just
# uploads artifacts.
#
# Linux uses cargo-zigbuild targeting glibc 2.28 (RHEL 8 / Debian 10 /
# Ubuntu 18.10 era, 2018) so the binaries run on any reasonably modern Linux.
# zig provides the C cross-toolchain that builds aws-lc-sys (C, via the AWS
# SDK's crypto) and pins the glibc version. glibc 2.28 is the floor: the io_uring
# `fast` runtime (monoio) calls statx(), whose glibc wrapper landed in 2.28, and
# a fully-static musl build is not possible (monoio only compiles against glibc).
# macOS builds run natively on a per-arch runner (macos-15-intel = Intel,
# macos-14 = Apple Silicon) so there is no C cross-compilation at all. The
# io_uring `fast` feature is Linux-only, so it is enabled on the Linux targets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to name the artifacts (e.g. v0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            build: zigbuild
            zigtarget: x86_64-unknown-linux-gnu.2.28
            features: fast
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            build: zigbuild
            zigtarget: aarch64-unknown-linux-gnu.2.28
            features: fast
          - target: x86_64-apple-darwin
            os: macos-15-intel
            build: cargo
            features: ''
          - target: aarch64-apple-darwin
            os: macos-14
            build: cargo
            features: ''

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # taiki-e/install-action no longer ships zig; install it separately
      # (mlugg/setup-zig puts the zig binary on PATH, which cargo-zigbuild
      # picks up). Pin zig 0.13.x: zig 0.15+ needs clang 18+ for the bindgen
      # used by aws-lc-sys, which the runners don't have.
      - name: Install zig (Linux)
        if: matrix.build == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild (Linux)
        if: matrix.build == 'zigbuild'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Build with the glibc-pinned target (e.g. x86_64-unknown-linux-gnu.2.28);
      # the binary still lands under the base triple dir (matrix.target).
      - name: Build (Linux, glibc-pinned via zigbuild)
        if: matrix.build == 'zigbuild'
        run: |
          FEAT="${{ matrix.features }}"
          cargo zigbuild --release --locked --target ${{ matrix.zigtarget }} \
            ${FEAT:+--features "$FEAT"}

      - name: Build (macOS, native)
        if: matrix.build == 'cargo'
        run: |
          FEAT="${{ matrix.features }}"
          cargo build --release --locked --target ${{ matrix.target }} \
            ${FEAT:+--features "$FEAT"}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/rs5cmd
          # Strip the release binary (works for both Linux ELF and macOS).
          strip "$bin" || true
          stage="rs5cmd-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "$bin" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || cp README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          # Checksum (shasum is present on both Linux and macOS runners).
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
          echo "archive=$stage.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$stage.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts (every run)
        uses: actions/upload-artifact@v7
        with:
          name: rs5cmd-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  # Repackage the prebuilt glibc Linux binaries into native distro packages
  # (.deb / .rpm / Arch .pkg.tar.zst) with nfpm, and attach them to the release.
  # One .deb covers Debian 10+/Ubuntu 18.10+ and one .rpm covers RHEL/Rocky/Alma
  # 8+ because the binaries are pinned to glibc 2.28 (see the build job above).
  package:
    name: package (deb/rpm/arch)
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: rs5cmd-*-unknown-linux-gnu
          path: artifacts

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.tag.outputs.tag }}"; ver="${ver#v}"
          mkdir -p stage
          for arch in x86_64 aarch64; do
            tar -C stage -xzf "artifacts/rs5cmd-${arch}-unknown-linux-gnu/rs5cmd-v${ver}-${arch}-unknown-linux-gnu.tar.gz"
          done
          ls -R stage

      - name: Install nfpm
        shell: bash
        run: |
          set -euo pipefail
          NFPM_VERSION=2.46.3
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" nfpm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nfpm" --version

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.tag.outputs.tag }}"; ver="${ver#v}"
          bash packaging/build-packages.sh "$ver" stage dist

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          fail_on_unmatched_files: true
